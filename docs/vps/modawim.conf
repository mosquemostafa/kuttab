# /etc/nginx/sites-available/modawim.conf
#
# SSL is terminated at Cloudflare's edge. This server uses a Cloudflare
# Origin Server Certificate so traffic between Cloudflare and the VPS
# is also encrypted (SSL mode: Full (strict) in Cloudflare dashboard).
#
# Before enabling this file:
#   1. Generate an Origin Certificate in Cloudflare:
#        Cloudflare dashboard → modawim.com → SSL/TLS → Origin Server → Create Certificate
#        Choose "Let Cloudflare generate a private key" and cover *.modawim.com + modawim.com
#   2. Copy the two files onto the VPS:
#        /etc/ssl/cloudflare/modawim.com.pem   ← "Origin Certificate" (.pem Cloudflare shows)
#        /etc/ssl/cloudflare/modawim.com.key   ← "Private Key" (shown only once — save it!)
#   3. Lock down permissions:
#        sudo mkdir -p /etc/ssl/cloudflare
#        sudo chmod 644 /etc/ssl/cloudflare/modawim.com.pem
#        sudo chmod 600 /etc/ssl/cloudflare/modawim.com.key
#   4. Link and reload:
#        sudo ln -s /etc/nginx/sites-available/modawim.conf /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx

# ── Redirect plain HTTP → HTTPS ───────────────────────────────────────────────
# Cloudflare hits your origin over HTTPS in Full (strict) mode, but keep this
# so any direct or misconfigured client is also redirected.
server {
    listen 80;
    listen [::]:80;
    server_name modawim.com www.modawim.com;

    return 301 https://www.modawim.com$request_uri;
}

# ── Redirect apex → www (HTTPS) ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name modawim.com;

    ssl_certificate     /etc/ssl/cloudflare/modawim.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/modawim.com.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    return 301 https://www.modawim.com$request_uri;
}

# ── Main HTTPS server on www ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.modawim.com;

    ssl_certificate     /etc/ssl/cloudflare/modawim.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/modawim.com.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # ── Optional but recommended: only accept traffic from Cloudflare IPs ────
    # This blocks anyone who discovers your VPS IP from bypassing Cloudflare.
    # Cloudflare publishes its ranges at https://www.cloudflare.com/ips/
    # After running the generation command at the bottom of this file, uncomment:
    #
    # include /etc/nginx/cloudflare-ips.conf;
    # deny all;

    # Security headers (Cloudflare adds some too; defence-in-depth)
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    # ── Next.js immutable static chunks ─────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4011;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Service worker & PWA manifest: always revalidate ────────────────────
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.json)$ {
        proxy_pass http://127.0.0.1:4011;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Everything else → Next.js app ───────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:4011;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 60s;
    }
}


# ── Generate /etc/nginx/cloudflare-ips.conf (run once, re-run when CF updates IPs) ──
#
# sudo bash -c '
#   {
#     echo "# Cloudflare IPv4"
#     curl -s https://www.cloudflare.com/ips-v4 | while read ip; do echo "allow $ip;"; done
#     echo "# Cloudflare IPv6"
#     curl -s https://www.cloudflare.com/ips-v6 | while read ip; do echo "allow $ip;"; done
#   } > /etc/nginx/cloudflare-ips.conf
# '
# sudo nginx -t && sudo systemctl reload nginx